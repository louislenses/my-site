<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мое портфолио</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        background-color: #060607;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        background-color: #888484;
        width: 100%;
        max-width: 360px;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        transition: 0.3s;
      }

      .card:hover {
        box-shadow: 0 10px 30px rgba(21, 22, 22, 0.4);
        scale: 1.1;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #18191a;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 6px;
      }

      .role {
        font-size: 14px;
        color: #f1ecec;
        margin-bottom: 24px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .link-item {
        display: block;
        background-color: #0e0d0d;
        color: rgb(232, 234, 235);
        text-decoration: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 500;
        transition: 0.3s;
      }

      .link-item:hover {
        background-color: #9cffd7;
      }
    </style>
  </head>
  <body>
    <!-- <header></header> -->
    <main class="card">
      <img
        class="avatar"
        src="https://i.pinimg.com/736x/40/9f/c0/409fc0d845343c224c6c27020fb86d13.jpg"
        alt="Макеев Хабир ALT"
      />
      <h1>Макеев Хабир</h1>
      <!-- <h2>Макеев Хабир</h2>
      <h3>Макеев Хабир</h3>
      <h4>Макеев Хабир</h4>
      <h5>Макеев Хабир</h5>
      <h6>Макеев Хабир</h6> -->
      <p class="role">Студент 1 курса | Будущий фронтендер</p>

      <div class="links">
        <a class="link-item" href="https://github.com">Мой GitHub</a>
        <a class="link-item" href="https://t.me">Telegram канал</a>
        <a class="link-item" href="#">Моё портфолио</a>
      </div>
    </main>
    <!-- <footer></footer> -->
  </body>
</html>
